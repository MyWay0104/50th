  <title id="title">옥쏘독 1회부터 50회까지의 흐름</title>
  <desc id="desc">1st부터 49th까지 이어진 월간 모임 노드가 에너지 커브와 함께 큰 50th 분기점으로 연결되는 다이내믹 인포그래픽</desc>
