<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>체인 미니 도식</title>
<style>
  /* 덱과 같은 글꼴을 쓴다 (index.html 의 @font-face 와 같은 경로) */
  @font-face { font-family: "Paperlogy"; font-weight: 400; src: url("assets/vendor/fonts/Paperlogy-4Regular.woff2") format("woff2"); }
  @font-face { font-family: "Paperlogy"; font-weight: 500; src: url("assets/vendor/fonts/Paperlogy-5Medium.woff2") format("woff2"); }
  @font-face { font-family: "Paperlogy"; font-weight: 600; src: url("assets/vendor/fonts/Paperlogy-6SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "Paperlogy"; font-weight: 700; src: url("assets/vendor/fonts/Paperlogy-7Bold.woff2") format("woff2"); }

  /* 덱의 :root 토큰을 그대로 옮겼다 */
  :root {
    --surface: #ffffff;
    --hairline: #e6e6e6;
    --box-line: #8a857f;
    --ink: rgba(0, 0, 0, 0.95);
    --ink-3: #615d59;
    --accent: #dd5b00;
    --accent-soft: rgba(221, 91, 0, 0.08);
    --radius: 12px;
    --font: "Paperlogy", "Pretendard", "Malgun Gothic", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: var(--font); }

  /* 자리표시(781×205)를 그대로 채우는 판 */
  .card {
    width: 781px; height: 205px;
    /* 따뜻한 종이 톤 (2026-09-19 사용자 선택) — 사람이 정리한 개념 도식 */
    background: #efe6d6;
    border: 1px solid #9c8b70;           /* 슬라이드 배경 대비 3.04:1 */
    border-radius: var(--radius);
    padding: 12px 24px;
    display: flex; flex-direction: column; gap: 8px;
    justify-content: center;
  }

  .row { display: flex; align-items: stretch; gap: 10px; }

  .box {
    flex: 1; min-width: 0;
    border: 1px solid #d5c7ae;
    border-radius: var(--radius);
    background: #fffcf4;
    padding: 12px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    text-align: center;
  }
  /* 첫 상자만 강조 — 변수를 갈아 끼우는 곳이 템플릿이다 */
  .box.accent { border-color: var(--accent); background: #fdf0e6; }

  .box img { width: 26px; height: 26px; margin-bottom: 2px; }
  .name { font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.15; letter-spacing: -0.2px; }
  .sub  { font-size: 24px; font-weight: 400; color: var(--ink-3); line-height: 1.3; white-space: nowrap; }

  /* 파이프(|)는 LangChain 의 잇기 기호, 화살표(→)는 흐름 */
  .link {
    align-self: center;
    font-size: 30px; font-weight: 600; color: var(--accent);
    width: 22px; text-align: center; flex: 0 0 22px;
  }

  .caption {
    font-size: 24px; color: var(--ink-3); text-align: center; line-height: 1.2;
  }
  .caption b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="box accent">
        <img src="assets/img/icons/file-text.svg" alt="템플릿 아이콘">
        <span class="name">템플릿</span>
        <span class="sub">system · 규칙</span>
        <span class="sub">user · {topic} 질문</span>
      </div>
      <span class="link">|</span>
      <div class="box">
        <img src="assets/img/icons/brain.svg" alt="LLM 아이콘">
        <span class="name">모델</span>
        <span class="sub">답을 만듦</span>
      </div>
      <span class="link">→</span>
      <div class="box">
        <img src="assets/img/icons/message-square.svg" alt="응답 아이콘">
        <span class="name">응답</span>
        <span class="sub">글자만 꺼내 출력</span>
      </div>
    </div>
    <p class="caption">세로 막대 <b>|</b> 는 앞의 출력을 뒤의 입력으로 잇습니다</p>
  </div>
</body>
</html>
